# TRMS mold pattern behavioral contract, format v1.
#
# This fixture is deliberately framework-free. Both the independently built
# Horizon Extension and NeoForge client Mod load it in their unit tests, so a
# future rule edit cannot silently alter one endpoint's prediction semantics.
format.version=1
interior.minimum=1
interior.maximum=14
interior.width=14
bit.count=196
byte.count=25

# Row-major mapping: (z - 1) * 14 + (x - 1).
index.1.1=0
index.14.1=13
index.1.14=182
index.14.14=195

# The first carve may begin at any interior coordinate.
empty.legal=1,1;14,14
empty.illegal=0,1;15,14;1,0;14,15

# Once (8,8) is carved, exactly its eight uncarved neighbours are legal in
# this local sample; duplicates, gaps, and the permanent border are rejected.
after.8.8.legal=7,7;8,7;9,7;7,8;9,8;7,9;8,9;9,9
after.8.8.illegal=8,8;10,8;0,8;15,8;8,0;8,15
